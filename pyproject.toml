[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "re-frame"
version = "0.1.0.dev0"
description = "Evidence-based, non-diagnostic, safety-layered chatbot pipeline for emotional distress self-management."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Siddhesh-ai-del" }]
dependencies = ["httpx>=0.27", "fastapi>=0.115", "uvicorn>=0.30"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.9",
    "mypy>=1.14",
]

[tool.hatch.build.targets.wheel]
packages = ["src/reframe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=reframe --cov-report=term-missing --cov-fail-under=100 -q"

[tool.coverage.run]
branch = true
source = ["reframe"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src"]
